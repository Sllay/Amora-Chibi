[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "amora-chibi"
version = "0.6.0.dev0"
description = "Core da Amora — IA-companheira persistente mobile-first"
requires-python = ">=3.11"
dependencies = [
  # TEMPORÁRIO (Termux/Python 3.14): 2.14.0b2 usa pydantic-core 2.49.0,
  # versão que possui wheel Android/arm64 compatível com Termux 3.14.6.
  # Reavaliar quando pydantic-core 2.50+ tiver wheel Android confiável.
  "pydantic==2.14.0b2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
amora = "amora.__main__:main"

[tool.setuptools]
package-dir = {"" = "core"}

[tool.setuptools.packages.find]
where = ["core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
