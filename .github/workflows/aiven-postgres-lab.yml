permissions:
  contents: read

jobs:
  synthetic-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: amora_pg_synthetic
          POSTGRES_USER: amora_ci
          POSTGRES_PASSWORD: synthetic_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amora_ci -d amora_pg_synthetic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install synthetic-only test dependencies
        run: |
          python -m pip install -e '.[dev,aiven-preflight]'
          python -m pip install --only-binary=:all: 'psycopg[binary]==3.3.9'
      - name: Compile serving Core and migration tests
        run: |
          python -m compileall -q core/amora tests
      - name: Run fail-closed unit tests and real PostgreSQL 18 integration
        env:
          AMORA_PG_SYNTHETIC_LAB: '1'
        run: |
          python -m pytest -q \
            tests/test_postgres_memory_lab_contract.py \
            tests/test_postgres_memory_lab_integration.py \
            tests/test_postgres_v18_manifest.py \
            tests/test_postgres_v18_lab_schema.py \
            tests/test_postgres_synthetic_import.py \
            tests/test_postgres_privacy_parity.py \
            tests/test_postgres_fts_parity.py \
            tests/test_postgres_fts_folded_lab.py \
            tests/test_postgres_fts_bm25_lab.py \
            tests/test_postgres_atomic_index_lab.py \
            tests/test_postgres_sql_connection_lab.py \
            tests/test_postgres_domain_parity.py \
            tests/test_postgres_speech_leases_lab.py \
            tests/test_postgres_auth_sessions_lab.py \
            tests/test_postgres_voice_stop_lab.py \
            tests/test_postgres_runtime_sql_audit.py \
            tests/test_postgres_conversation_read_lab.py \
            tests/test_postgres_runtime_connection.py \
            tests/test_postgres_run1_end_to_end.py \
            tests/test_postgres_run1_memory_integration.py \
            tests/test_postgres_run2_core_bootstrap.py \
            tests/test_postgres_run2_usage_boundary.py \
            tests/test_postgres_run2_messaging_queue.py \
            tests/test_postgres_run2_cognition_v1.py \
            tests/test_postgres_run2_rank_parity.py \
            tests/test_postgres_run2_atomic_decay.py \
            tests/test_postgres_run2_episode_fence.py \
            tests/test_postgres_run2_reflection_queue.py \
            tests/test_postgres_run2_replica_epoch.py \
            tests/test_postgres_run2_native_backup_restore.py \
            tests/test_postgres_run2_episode_worker.py \
            tests/test_postgres_run2_discord_core.py \
            tests/test_postgres_run2_discord_pipeline.py \
            tests/test_postgres_run2_scaled_import.py \
            tests/test_postgres_run2_unicode_rank_stress.py \
            tests/test_postgres_runtime_domain_contract.py \
            tests/test_postgres_run3_sql_inventory.py
