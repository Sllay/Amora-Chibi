name: Core tests

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24 runtime
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24 runtime
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Test
        run: pytest
      - name: Doctor smoke test
        env:
          AMORA_HOME: ${{ runner.temp }}/amora-runtime
        run: python -m amora doctor
      - name: Autonomy smoke test
        env:
          AMORA_HOME: ${{ runner.temp }}/amora-runtime
        run: |
          amora-autonomy state
          amora-autonomy cycle --dedupe-key ci-autonomy-cycle
      - name: Actions smoke test
        env:
          AMORA_HOME: ${{ runner.temp }}/amora-runtime
        run: |
          amora-actions state
          python -m amora.actions state
      - name: Conversation smoke test
        env:
          AMORA_HOME: ${{ runner.temp }}/amora-runtime
        run: |
          amora-conversation state
          python -m amora.conversation state
          python -m amora.conversation say "Papis?" --dedupe-key ci-v08-speech
      - name: Avatar smoke test
        env:
          AMORA_HOME: ${{ runner.temp }}/amora-runtime
        run: |
          amora-avatar state
          python -m amora.avatar project
          python -m amora.avatar url
      - name: Backup smoke test
        env:
          AMORA_HOME: ${{ runner.temp }}/amora-runtime
        run: |
          python -m amora backup --name ci.db
          test -f "$AMORA_HOME/backups/ci.db"
          test -f "$AMORA_HOME/backups/ci.db.avatar.zip"
