name: Core tests

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Test
        run: pytest
      - name: Doctor smoke test
        env:
          AMORA_HOME: ${{ runner.temp }}/amora-runtime
        run: python -m amora doctor
      - name: Autonomy smoke test
        env:
          AMORA_HOME: ${{ runner.temp }}/amora-runtime
        run: |
          amora-autonomy state
          amora-autonomy cycle --dedupe-key ci-autonomy-cycle
      - name: Actions smoke test
        env:
          AMORA_HOME: ${{ runner.temp }}/amora-runtime
        run: |
          amora-actions state
          python -m amora.actions state
      - name: Backup smoke test
        env:
          AMORA_HOME: ${{ runner.temp }}/amora-runtime
        run: |
          python -m amora backup --name ci.db
          test -f "$AMORA_HOME/backups/ci.db"
