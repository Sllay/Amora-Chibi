name: Core tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/aiven-**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24 runtime
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24 runtime
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Install pinned native SDK (laboratory only)
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request' && (startsWith(github.head_ref, 'lab/pcs') || startsWith(github.head_ref, 'feat/pcs4-'))
        run: |
          printf '%s\n' 'libsql==0.1.8 --hash=sha256:74f3e999dd7a710dd5fc361f5d6299b7bbb1c62db9090ae7958d2d2cb49ff920' > /tmp/pcs1-libsql.txt
          python -m pip install --only-binary=:all: --require-hashes -r /tmp/pcs1-libsql.txt
      - name: Start disposable loopback primary
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request' && (startsWith(github.head_ref, 'lab/pcs') || startsWith(github.head_ref, 'feat/pcs4-'))
        run: |
          docker run --name pcs1-sqld -d -p 127.0.0.1:8080:8080 \
            -e SQLD_NODE=primary \
            -e SQLD_HTTP_LISTEN_ADDR=0.0.0.0:8080 \
            -e SQLD_GRPC_LISTEN_ADDR=0.0.0.0:5001 \
            ghcr.io/tursodatabase/libsql-server@sha256:1bc51611928ccc51229bdc40ca0defcb915907f8f9f6a664b43529de0ca45fab
          for attempt in $(seq 1 30); do
            if curl --max-time 2 -sS -o /dev/null http://127.0.0.1:8080/; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Exercise native replica and recovery contracts
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request' && (startsWith(github.head_ref, 'lab/pcs') || startsWith(github.head_ref, 'feat/pcs4-'))
        run: timeout 120s python tools/cloud/pcs1-replica-probe.py
      - name: Dispose of fixture
        if: always() && matrix.python-version == '3.12' && github.event_name == 'pull_request' && (startsWith(github.head_ref, 'lab/pcs') || startsWith(github.head_ref, 'feat/pcs4-'))
        run: |
          docker logs pcs1-sqld || true
          docker rm -f pcs1-sqld || true
      - name: Start full-schema disposable primary
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request' && (startsWith(github.head_ref, 'lab/pcs2') || startsWith(github.head_ref, 'lab/pcs3') || startsWith(github.head_ref, 'feat/pcs4-'))
        run: |
          docker run --name pcs2-sqld -d -p 127.0.0.1:8081:8080 \
            -e SQLD_NODE=primary \
            -e SQLD_HTTP_LISTEN_ADDR=0.0.0.0:8080 \
            -e SQLD_GRPC_LISTEN_ADDR=0.0.0.0:5001 \
            ghcr.io/tursodatabase/libsql-server@sha256:1bc51611928ccc51229bdc40ca0defcb915907f8f9f6a664b43529de0ca45fab
          for attempt in $(seq 1 30); do
            if curl --max-time 2 -fsS -o /dev/null http://127.0.0.1:8081/health; then exit 0; fi
            if curl --max-time 2 -sS -o /dev/null http://127.0.0.1:8081/; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Certify full schema with real native replica
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request' && (startsWith(github.head_ref, 'lab/pcs2') || startsWith(github.head_ref, 'lab/pcs3') || startsWith(github.head_ref, 'feat/pcs4-'))
        env:
          AMORA_PCS2_NATIVE_LAB: '1'
        run: timeout 180s python -m pytest -s tests/test_pcs2_native_schema.py
      - name: Dispose of full-schema fixture
        if: always() && matrix.python-version == '3.12' && github.event_name == 'pull_request' && (startsWith(github.head_ref, 'lab/pcs2') || startsWith(github.head_ref, 'lab/pcs3') || startsWith(github.head_ref, 'feat/pcs4-'))
        run: |
          docker logs pcs2-sqld || true
          docker rm -f pcs2-sqld || true
      - name: Test
        run: pytest
      - name: RUN01 resource-constrained offline Core
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/stabilization-')
        run: |
          docker build -t amora-run01-resource .
          timeout 180s docker run --rm --network none --cpus=0.2 --memory=512m --memory-swap=512m --pids-limit=64 \
            -v "$GITHUB_WORKSPACE/tools/cloud/stabilization_run01_resource_probe.py:/tmp/probe.py:ro" \
            --entrypoint /opt/venv/bin/python amora-run01-resource /tmp/probe.py
      - name: Doctor smoke test
        env:
          AMORA_HOME: ${{ runner.temp }}/amora-runtime
        run: python -m amora doctor
      - name: Autonomy smoke test
        env:
          AMORA_HOME: ${{ runner.temp }}/amora-runtime
        run: |
          amora-autonomy state
          amora-autonomy cycle --dedupe-key ci-autonomy-cycle
      - name: Actions smoke test
        env:
          AMORA_HOME: ${{ runner.temp }}/amora-runtime
        run: |
          amora-actions state
          python -m amora.actions state
      - name: Conversation smoke test
        env:
          AMORA_HOME: ${{ runner.temp }}/amora-runtime
        run: |
          amora-conversation state
          python -m amora.conversation state
          python -m amora.conversation say "Papis?" --dedupe-key ci-v08-speech
      - name: Avatar smoke test
        env:
          AMORA_HOME: ${{ runner.temp }}/amora-runtime
        run: |
          amora-avatar state
          python -m amora.avatar project
          python -m amora.avatar url
      - name: Backup smoke test
        env:
          AMORA_HOME: ${{ runner.temp }}/amora-runtime
        run: |
          python -m amora backup --name ci.db
          test -f "$AMORA_HOME/backups/ci.db"
          test -f "$AMORA_HOME/backups/ci.db.avatar.zip"
