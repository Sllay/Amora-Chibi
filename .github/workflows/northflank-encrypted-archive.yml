name: Northflank encrypted log archive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: northflank-encrypted-archive
  cancel-in-progress: false

jobs:
  archive:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Read-only Northflank fetch, zip and encrypt inside ephemeral runner
        shell: bash
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          NORTHFLANK_PROJECT_ID: ${{ vars.NORTHFLANK_PROJECT_ID }}
          NORTHFLANK_TEAM_ID: ${{ vars.NORTHFLANK_TEAM_ID }}
          ARCHIVE_PASSPHRASE: ${{ secrets.AMORA_LOG_ARCHIVE_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$NORTHFLANK_API_TOKEN" ]] || { echo 'Missing secret NORTHFLANK_API_TOKEN'; exit 1; }
          [[ -n "$ARCHIVE_PASSPHRASE" ]] || { echo 'Missing secret AMORA_LOG_ARCHIVE_PASSPHRASE'; exit 1; }
          [[ -n "$NORTHFLANK_PROJECT_ID" ]] || { echo 'Missing variable NORTHFLANK_PROJECT_ID'; exit 1; }
          scratch="$(mktemp -d "$RUNNER_TEMP/northflank-archive.XXXXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          # No stdout/stderr log contents, unredacted files or artifacts leave
          # the runner. A partial collection fails closed instead of publishing.
          python tools/ops/northflank_log_collector.py --output "$scratch/collected"
          python tools/ops/northflank_log_archive.py pack \
            --input "$scratch/collected" --output "$scratch/archive.zip"
          printf '%s' "$ARCHIVE_PASSPHRASE" | gpg \
            --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --s2k-mode 3 \
            --s2k-digest-algo SHA512 --s2k-count 65011712 \
            --output "$scratch/latest.zip.gpg" "$scratch/archive.zip"
          mkdir -p ops/logs
          install -m 600 "$scratch/latest.zip.gpg" ops/logs/northflank-latest.zip.gpg
      - name: Commit ciphertext only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- ops/logs/northflank-latest.zip.gpg
          if ! git diff --cached --quiet; then
            git commit -m 'chore(ops): rotate encrypted Northflank six-run snapshot [skip ci]'
            git push origin HEAD:main
          fi
