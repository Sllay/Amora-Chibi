name: Altare - package reviewed release images

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PACKAGE_ALTARE_STAGING to package this commit; no deployment
        required: true
        type: string
      include_browser:
        description: Package optional Chromium worker (large image, experimental)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: altare-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' &&
        inputs.confirmation == 'PACKAGE_ALTARE_STAGING') ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.number == 349 &&
        github.event.comment.user.login == 'Sllay' &&
        github.event.comment.body == '/amora altare package'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test portable hosting and read-model contracts
        run: |
          python -m pip install --disable-pip-version-check -c deploy/python.lock -e '.[dev]'
          python -m pytest tests/test_portable_host_profiles.py -q

  package:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            dockerfile: Dockerfile
          - name: discord
            dockerfile: workers/discord/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable amd64 image for Altare, no deployment
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sllay/amora-chibi-${{ matrix.name }}:${{ github.sha }}
          # Altare currently consumes linux/amd64 images; avoid GHCR OCI index
          # with an extra unknown/unknown attestation platform for a single arch.
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/Sllay/Amora-Chibi
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Confirm image tag (no secrets)
        run: echo 'Built ${{ matrix.name }} from ${{ github.sha }}'

  browser:
    needs: validate
    if: inputs.include_browser
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/browser/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sllay/amora-chibi-browser:${{ github.sha }}
          # Altare currently consumes linux/amd64 images; avoid GHCR OCI index
          # with an extra unknown/unknown attestation platform for a single arch.
          provenance: false
          sbom: false
