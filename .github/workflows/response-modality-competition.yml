name: Response modality competition

on:
  pull_request:
    paths:
      - 'core/amora/messaging/**'
      - 'core/amora/cognition/**'
      - 'core/amora/actions/**'
      - 'core/amora/autonomy/**'
      - 'tests/test_response_modality_step5.py'
      - 'tests/test_capability_grounded_intent_step4.py'
      - 'tests/test_cognitive_capability_projection_step3.py'
      - '.github/workflows/response-modality-competition.yml'
  push:
    branches: [main]
    paths:
      - 'core/amora/messaging/**'
      - 'core/amora/cognition/**'
      - 'core/amora/actions/**'
      - 'core/amora/autonomy/**'
      - 'tests/test_response_modality_step5.py'
      - 'tests/test_capability_grounded_intent_step4.py'
      - 'tests/test_cognitive_capability_projection_step3.py'
      - '.github/workflows/response-modality-competition.yml'

permissions:
  contents: read

concurrency:
  group: response-modality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24 runtime
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24 runtime
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Compile response modality runtime
        run: python -m compileall -q core/amora/messaging core/amora/cognition core/amora/actions core/amora/autonomy
      - name: Response modality contracts
        run: |
          python -m pytest -q \
            tests/test_response_modality_step5.py \
            tests/test_capability_grounded_intent_step4.py \
            tests/test_cognitive_capability_projection_step3.py
