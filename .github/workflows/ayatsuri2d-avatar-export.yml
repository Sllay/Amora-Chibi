name: Amora Ayatsuri2D headless export (experimental)
on:
  workflow_dispatch:
  push:
    branches: [feat/ayatsuri2d-actions-prototype]
    paths:
      - ".github/workflows/ayatsuri2d-avatar-export.yml"
      - "tools/ayatsuri-batch/**"
      - "assets/amora-live2d/**"
  pull_request:
    paths:
      - ".github/workflows/ayatsuri2d-avatar-export.yml"
      - "tools/ayatsuri-batch/**"
      - "assets/amora-live2d/**"
permissions:
  contents: read
jobs:
  ayatsuri-headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Amora
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/ayatsuri-batch
      - name: Test real Ayatsuri2D Rust static exporter
        run: cargo test --manifest-path tools/ayatsuri-batch/Cargo.toml --all-targets
      - name: Install Pillow for lossless layer validation
        run: python -m pip install --disable-pip-version-check --user pillow==11.3.0
      - name: Verify uploaded 10 layers and prepare original order for preview
        run: |
          python tools/ayatsuri-batch/prepare_assets.py \
            assets/amora-live2d/manifest.json artifacts/amora-prepared
      - name: Export actual Amora static MOC3 model
        run: |
          cargo run --release --manifest-path tools/ayatsuri-batch/Cargo.toml -- \
            artifacts/amora-prepared/manifest.json artifacts/AmoraBolinha
      - name: Validate complete model references
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/AmoraBolinha")
          model = json.loads((root / "AmoraBolinha.model3.json").read_text())
          refs = model["FileReferences"]
          for key in (refs["Moc"], refs["DisplayInfo"], *refs["Textures"]):
              assert (root / key).is_file(), f"Missing referenced file: {key}"
          assert (root / refs["Moc"]).read_bytes()[:4] == b"MOC3"
          print("Static model bundle verified; NOT yet a deforming/binking physics rig.")
          PY
      - name: Publish static model, unchanged source files and preview
        uses: actions/upload-artifact@v4
        with:
          name: amora-bolinha-organizacao-e-moc3-estatico
          path: |
            assets/amora-live2d/manifest.json
            assets/amora-live2d/layers/
            artifacts/amora-prepared/amora_montada.png
            artifacts/amora-prepared/source_order.json
            artifacts/AmoraBolinha/
          if-no-files-found: error
          retention-days: 7
