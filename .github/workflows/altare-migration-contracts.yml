name: Altare migration contracts

on:
  pull_request:
    paths:
      - 'tools/ops/altare_*.py'
      - 'tests/test_altare_*.py'
      - 'deploy/altare/**'
      - '.github/workflows/altare-*.yml'
      - 'docs/engineering/ALTARE_FULL_CUTOVER_RUNBOOK.md'
      - 'docs/engineering/ALTARE_PORTABILITY_RUNBOOK.md'
      - 'core/amora/host_preflight.py'
      - 'core/amora/storage/pcs4_dev.py'
      - '.github/workflows/northflank-encrypted-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested project tooling, no secret credentials
        run: python -m pip install --disable-pip-version-check -c deploy/python.lock -e '.[dev]' 'cryptography==50.0.2'
      - name: Test private env handoff and allowlisted Altare diagnostics
        run: |
          python -m pytest tests/test_altare_env_handoff.py tests/test_altare_readonly_diagnostics.py tests/test_altare_safe_report.py tests/test_altare_host_portability.py tests/test_altare_bulk_env_apply.py tests/test_altare_phone_env_import.py tests/test_altare_sealed_image_crypto.py -v
