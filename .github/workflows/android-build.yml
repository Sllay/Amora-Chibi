name: Android build

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore stable Amora dev signing key
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          AMORA_DEBUG_KEYSTORE_B64: ${{ secrets.AMORA_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$AMORA_DEBUG_KEYSTORE_B64" ]; then
            echo "::error::Repository secret AMORA_DEBUG_KEYSTORE_B64 is required for trusted Amora APK builds."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$AMORA_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Create ephemeral signing key for fork PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Amora Untrusted PR Debug,O=AMORA IA,C=BR" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30
      - name: Configure Android SDK / NDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
      - name: Prepare pinned voice/native dependencies
        run: bash android/tools/prepare-deps.sh
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build and test
        run: gradle -p android --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: APK metadata
        shell: bash
        run: |
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/SHA256.txt
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: amora-chibi-dev13-tts-crash-hotfix-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256.txt
          if-no-files-found: error
