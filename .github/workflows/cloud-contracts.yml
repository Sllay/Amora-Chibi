name: Cloud container contracts
on:
  pull_request:
    paths: ['core/**', 'config/**', 'web/**', 'avatar/**', 'deploy/**', 'Dockerfile', 'tools/cloud/**', 'pyproject.toml', '.github/workflows/cloud-contracts.yml']
  push:
    branches: [main]
    paths: ['core/**', 'config/**', 'web/**', 'avatar/**', 'deploy/**', 'Dockerfile', 'tools/cloud/**', 'pyproject.toml', '.github/workflows/cloud-contracts.yml']
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24 runtime
      - run: docker build -t amora-core:test .
      - run: python3 tools/cloud/smoke-container.py amora-core:test
      - name: Build test-only layer over the runtime under review
        run: docker build --build-arg RUNTIME_IMAGE=amora-core:test -f deploy/containers/Dockerfile.validation -t amora-validation:test .
      - name: Check runtime dependencies without adding pip to runtime
        run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges amora-validation:test /testenv/bin/python -m pip --python /opt/venv/bin/python check
      - name: Targeted cloud/storage/runtime regressions on runtime libc
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,size=256m amora-validation:test \
            python -m pytest -p no:cacheprovider \
            tests/test_cloud_runtime.py \
            tests/test_cloud_web_incident.py \
            tests/test_remote_storage.py \
            tests/test_remote_voice.py \
            tests/test_usage_recovery_stt.py \
            tests/test_platform_messaging_remote.py \
            tests/test_storage.py \
            tests/test_conversation_runtime_v15.py

  native-replica:
    # Experimental SDK checks are limited to PCS laboratory PRs.
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'lab/pcs')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned native SDK (laboratory only)
        run: python -m pip install --only-binary=:all: libsql==0.1.11
      - name: Start disposable loopback primary
        run: |
          docker run --name pcs1-sqld -d -p 127.0.0.1:8080:8080 \
            -e SQLD_NODE=primary \
            -e SQLD_HTTP_LISTEN_ADDR=0.0.0.0:8080 \
            -e SQLD_GRPC_LISTEN_ADDR=0.0.0.0:5001 \
            ghcr.io/tursodatabase/libsql-server@sha256:1bc51611928ccc51229bdc40ca0defcb915907f8f9f6a664b43529de0ca45fab
          for attempt in $(seq 1 30); do
            if curl --max-time 2 -sS -o /dev/null http://127.0.0.1:8080/; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Exercise native replica and recovery contracts
        run: timeout 120s python tools/cloud/pcs1-replica-probe.py
      - name: Dispose of fixture
        if: always()
        run: |
          docker logs pcs1-sqld || true
          docker rm -f pcs1-sqld || true
