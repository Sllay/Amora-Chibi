name: Visual Engine V5 RUN 04 — native Cubism
on:
  push:
    branches: [feat/visual-engine-v5-run04, feat/visual-engine-v5-staging, fix/visual-v5-optional-startup, fix/visual-v5-persistent-build, feat/visual-v5-prism-link]
    paths: ['tools/visual-engine-v5/**','core/amora/**','web/**','tests/test_visual_stream_v5.py','tests/test_visual_preview_v5.py','.github/workflows/visual-engine-v5-run04.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  cubism-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core visual transport and authorization
        run: |
          python -m pip install -e '.[dev]'
          pytest tests/test_visual_preview_v5.py tests/test_visual_stream_v5.py tests/test_avatar_v09.py tests/test_avatar_bundle.py tests/test_avatar_rig_v2.py tests/test_emotion_v05.py tests/test_emotion_recovery_v05.py tests/test_security_predeploy.py
          node --experimental-default-type=module --test tools/visual-engine-v5/body-controller.test.mjs
          node --test tests/*.test.mjs
      - name: Build from immutable public model and official hosted Core (CI only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          sh tools/visual-engine-v5/fetch-preserved-rig.sh "$scratch/rig"
          sh tools/visual-engine-v5/fetch-hosted-core.sh "$scratch/core.js"
          sh tools/visual-engine-v5/build-preview.sh "$scratch/rig" "$scratch/core.js" .build "$GITHUB_SHA"
          cp .build/identity.json evidence/identity.json
          cp .build/manifest.json evidence/manifest.json
          npm install --prefix tools/visual-engine-v5 --no-save puppeteer-core@24.24.1
      - name: Reproduce enabled Northflank Docker build (no secrets)
        run: |
          set -euo pipefail
          docker build --build-arg AMORA_VISUAL_V5_BUILD=1 --build-arg NF_GIT_SHA="$GITHUB_SHA" -t amora-v5-private-test .
          docker run --rm --entrypoint python amora-v5-private-test -c 'from pathlib import Path; from amora.avatar.visual_preview import verify_preview; verify_preview(Path("/opt/amora/visual-v5")); print("V5_ENABLED_DOCKER_PACKAGE_VERIFIED")'
          docker image rm amora-v5-private-test
      - name: Validate overlay and Companion using real MOC3
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory .build > /tmp/amora-v5-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          node tools/visual-engine-v5/validate.cjs
          node tools/visual-engine-v5/validate-run02.cjs
      - name: Real Core network certification and sustained render
        run: |
          set -euo pipefail
          python tools/visual-engine-v5/serve-cert.py >/tmp/amora-v5-cert.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:8767/health >/dev/null; then break; fi; sleep 1; done
          curl -fsS http://127.0.0.1:8767/health >/dev/null
          node tools/visual-engine-v5/validate-run04.cjs
          rm -f .cert-core/pairing-test.txt .cert-core/web-test-token.txt .cert-core/preview-password.txt
      - name: Upload evidence only (never proprietary Core)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amora-v5-run04-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
