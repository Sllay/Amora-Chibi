name: Avatar tests

on:
  push:
    paths:
      - 'avatar/**'
      - 'web/**'
      - 'tests/web_*.test.mjs'
      - 'tests/helpers/**'
      - '.github/workflows/avatar-tests.yml'
  pull_request:
    paths:
      - 'avatar/**'
      - 'web/**'
      - 'tests/web_*.test.mjs'
      - 'tests/helpers/**'
      - '.github/workflows/avatar-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24 runtime
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, Node 24 runtime
        with:
          node-version: '22.23.4'
      - name: Verify minimum secure Node
        run: node -e "const [a,b,c]=process.versions.node.split('.').map(Number); if(a<22||(a===22&&(b<23||(b===23&&c<4)))) process.exit(1)"
      - name: Parse Studio modules
        run: |
          node --check avatar/engine.js
          node --check avatar/app.js
          node --check avatar/rig-v2.js
          node --check avatar/bundle-ui.js
          node --check avatar/sw.js
          node --check web/app-v2.js
          node --check web/fetch-resilience.js
          node --check web/realtime-preview.js
          node --check web/audio-player.mjs
          node --check web/browser-state.mjs
          node --check web/operator-state.mjs
          node --check web/operator-presence-authority.mjs
          node --check web/operator-panel.js
      - name: Test Avatar Engine
        run: npm --prefix avatar test
      - name: Test Safari queue diagnostics and text without voice
        run: node --test tests/web_*.test.mjs
