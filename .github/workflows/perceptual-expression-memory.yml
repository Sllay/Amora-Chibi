name: Perceptual expression memory

on:
  pull_request:
    paths:
      - 'core/amora/messaging/**'
      - 'core/amora/storage/**'
      - 'tests/test_perceptual_expression_memory_step6.py'
      - 'tests/test_perceptual_expression_memory_hardening_step6.py'
      - 'tests/test_response_modality_step5.py'
      - 'tests/test_visual_enrichment_service_ch2.py'
      - 'tests/test_groq_visual_analyzer_ch2.py'
      - '.github/workflows/perceptual-expression-memory.yml'
  push:
    branches: [main]
    paths:
      - 'core/amora/messaging/**'
      - 'core/amora/storage/**'
      - 'tests/test_perceptual_expression_memory_step6.py'
      - 'tests/test_perceptual_expression_memory_hardening_step6.py'
      - 'tests/test_response_modality_step5.py'
      - 'tests/test_visual_enrichment_service_ch2.py'
      - 'tests/test_groq_visual_analyzer_ch2.py'
      - '.github/workflows/perceptual-expression-memory.yml'

permissions:
  contents: read

concurrency:
  group: perceptual-expression-memory-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Compile perceptual memory runtime
        run: python -m compileall -q core/amora/messaging core/amora/storage
      - name: Perceptual expression memory contracts
        run: |
          python -m pytest -q \
            tests/test_perceptual_expression_memory_step6.py \
            tests/test_perceptual_expression_memory_hardening_step6.py \
            tests/test_response_modality_step5.py \
            tests/test_visual_enrichment_service_ch2.py \
            tests/test_groq_visual_analyzer_ch2.py
