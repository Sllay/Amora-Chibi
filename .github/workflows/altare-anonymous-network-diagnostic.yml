name: Altare - compare anonymous and authenticated API status

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compare:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'Sllay' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.number == 349 &&
        github.event.comment.body == '/amora altare network diagnose'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare status and response type; never print credentials or content
        shell: bash
        env:
          ALTARE_TOKEN_CONFIG: ${{ secrets.ALTARE_TOKEN_CONFIG }}
        run: |
          set -euo pipefail
          set +x
          python - <<'PY' | tee "$RUNNER_TEMP/altare-diagnostic.txt"
          import os
          import urllib.request
          import urllib.error

          token = os.environ.get('ALTARE_TOKEN_CONFIG', '')
          if not token.startswith('alt_') or any(ch.isspace() for ch in token):
              print('ALTARE_SECRET_FORMAT_MISSING_OR_INVALID')
              raise SystemExit(2)
          url = 'https://console.altare.gg/api/api-tokens/self'

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def probe(label, authenticated):
              headers = {'Accept': 'application/json'}
              if authenticated:
                  headers['Authorization'] = 'Bearer ' + token
              request = urllib.request.Request(url, headers=headers, method='GET')
              try:
                  with urllib.request.build_opener(NoRedirect()).open(request, timeout=15) as response:
                      status = response.status
                      mime = response.headers.get('Content-Type', '')
                      server = response.headers.get('Server', '')
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  mime = exc.headers.get('Content-Type', '')
                  server = exc.headers.get('Server', '')
              except (urllib.error.URLError, OSError, ValueError, TimeoutError):
                  print(label + '=NETWORK_ERROR')
                  return
              type_enum = 'JSON' if 'json' in mime.lower() else 'HTML' if 'html' in mime.lower() else 'OTHER'
              cdn_enum = 'CDN' if 'cloudflare' in server.lower() else 'NON_CDN'
              print(label + '=HTTP_' + str(status) + ':' + type_enum + ':' + cdn_enum)

          probe('ALTARE_WITHOUT_TOKEN', False)
          probe('ALTARE_WITH_SAVED_TOKEN', True)
          PY
      - name: Probe documented API using curl as an independent HTTP client
        if: always()
        shell: bash
        env:
          ALTARE_TOKEN: ${{ secrets.ALTARE_TOKEN_CONFIG }}
        run: |
          set -euo pipefail
          set +x
          if [[ "$ALTARE_TOKEN" != alt_* ]]; then
            echo 'ALTARE_CURL_WITH_SAVED_TOKEN=TOKEN_INVALID' | tee -a "$RUNNER_TEMP/altare-diagnostic.txt"
            exit 0
          fi
          result="$(curl --silent --connect-timeout 8 --max-time 20 \
            --output /dev/null --write-out '%{http_code}:%{content_type}' \
            --header "Authorization: Bearer $ALTARE_TOKEN" \
            --header 'Accept: application/json' \
            'https://console.altare.gg/api/api-tokens/self' || true)"
          code="$(printf '%s' "$result" | cut -d: -f1)"
          mime="$(printf '%s' "$result" | cut -d: -f2-)"
          if [[ ! "$code" =~ ^[0-9]{3}$ || "$code" == 000 ]]; then
            out=NETWORK_ERROR
          elif [[ "$mime" == application/json* ]]; then
            out="HTTP_$code:JSON"
          elif [[ "$mime" == text/html* ]]; then
            out="HTTP_$code:HTML"
          else
            out="HTTP_$code:OTHER"
          fi
          echo "ALTARE_CURL_WITH_SAVED_TOKEN=$out" | tee -a "$RUNNER_TEMP/altare-diagnostic.txt"
      - name: Publish sanitized diagnosis on issue 349
        if: always() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = process.env.RUNNER_TEMP + '/altare-diagnostic.txt';
            const lines = fs.existsSync(p) ? fs.readFileSync(p, 'utf8').split('\n') : [];
            const safe = (name) => {
              const prefix = name + '=';
              const line = lines.find(x => x.startsWith(prefix));
              const value = line ? line.slice(prefix.length).trim() : '';
              return /^[A-Z0-9_:]{1,100}$/.test(value) ? value : 'NO_RESULT';
            };
            const shape = lines.includes('ALTARE_SECRET_FORMAT_MISSING_OR_INVALID') ? 'MISSING_OR_MALFORMED' : 'NOT_FLAGGED';
            const body = [
              '**Diagnóstico Altare (automático; sem segredos)**',
              '- Token no GitHub: ' + shape,
              '- Sem token: ' + safe('ALTARE_WITHOUT_TOKEN'),
              '- Com token (Python): ' + safe('ALTARE_WITH_SAVED_TOKEN'),
              '- Com token (curl): ' + safe('ALTARE_CURL_WITH_SAVED_TOKEN'),
              'Nenhuma credencial, ID de equipe ou corpo HTTP foi publicado.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 349,
              body
            });
