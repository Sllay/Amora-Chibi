name: Provider certification

on:
  pull_request:
    paths:
      - 'core/amora/cognition/**'
      - 'tests/test_ch3_provider_certification.py'
      - 'tests/test_ch3_provider_ab.py'
      - 'tests/test_ch3_provider_resilience.py'
      - 'tests/test_cognitive_replay_v10.py'
      - '.github/workflows/provider-certification.yml'
  push:
    branches: [main]
    paths:
      - 'core/amora/cognition/**'
      - 'tests/test_ch3_provider_certification.py'
      - 'tests/test_ch3_provider_ab.py'
      - 'tests/test_ch3_provider_resilience.py'
      - 'tests/test_cognitive_replay_v10.py'
      - '.github/workflows/provider-certification.yml'

permissions:
  contents: read

jobs:
  certification-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24 runtime
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24 runtime
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Compile cognition package
        run: python -m compileall -q core/amora/cognition
      - name: Provider certification contracts
        run: |
          python -m pytest -q \
            tests/test_ch3_provider_certification.py \
            tests/test_ch3_provider_ab.py \
            tests/test_ch3_provider_resilience.py \
            tests/test_cognitive_replay_v10.py
