name: Amora - diagnostico seguro Northflank

on:
  push:
    branches:
      - ops/amora-recovery-readonly-20261119
    paths:
      - .github/workflows/amora-recovery-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-readonly-audit:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[amora-readonly-audit]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Garantir token sem expor valor
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NF_BACKUP_API_TOKEN }}
        run: |
          if [ -z "$NORTHFLANK_API_TOKEN" ]; then
            echo "::error::NF_BACKUP_API_TOKEN indisponivel"
            exit 1
          fi
          echo "Token presente; somente requisicoes GET, sem acesso a secrets."

      - name: Auditoria somente leitura de Core, PCS4C e Aiven
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NF_BACKUP_API_TOKEN }}
        run: |
          python tools/ops/northflank_readonly_audit.py \
            --team mejorberrys-team \
            --project default \
            --core loyal-coat \
            --pcs4-job pcs4c-recovery
