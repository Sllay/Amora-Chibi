name: Voice Kitchen

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/voice_kitchen/**"
      - "tests/test_voice_kitchen_*.py"
      - ".github/workflows/voice-kitchen.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audition runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install "supertonic==1.3.1" "pyworld-prebuilt==0.3.6.post1"

      - name: Render F1/F5 candidates
        run: |
          python tools/voice_kitchen/render_supertonic_candidates.py \
            --out-dir voice-kitchen-wavs \
            --steps 8 \
            --speed 1.0

      - name: Apply WORLD polished child candidates
        run: |
          python tools/voice_kitchen/apply_world_vtl_candidates.py \
            --root voice-kitchen-wavs

      - name: Render frozen FINAL_B reference
        run: |
          python tools/voice_kitchen/apply_world_final_ab.py \
            --root voice-kitchen-wavs

      - name: Render subtle VoiceSignature v1
        run: |
          python tools/voice_kitchen/apply_amora_signature_v1.py \
            --root voice-kitchen-wavs

          cat > voice-kitchen-wavs/README.txt <<'EOF'
          AMORA VOICE KITCHEN — VOICE SIGNATURE V1 SOFT

          Base congelada por BK:
          - amora_child_final_b_plus60.wav
          - 40% da direção CLEAR / 60% PLUS
          - esta rodada NÃO altera novamente idade/tamanho vocal.

          Candidato de assinatura:
          - amora_voice_signature_v1_soft.wav

          O que muda sobre FINAL_B:
          - aperiodicidade WORLD: 0.965x (mudança mínima para uma textura um pouco
            mais limpa/periódica de vocal synth);
          - camada harmônica soft: drive 1.30, wet apenas 5%, com RMS preservado.

          O que NÃO entra:
          - nenhum pitch extra;
          - nenhum novo formant/VTL;
          - bitcrush: OFF;
          - sample-hold: OFF;
          - ring modulation: OFF.

          Objetivo:
          dar uma assinatura própria discretamente sintética sem transformar a
          voz em robô, alien, esquilo ou efeito chamativo. A base precisa continuar
          reconhecível como FINAL_B e a inteligibilidade deve permanecer intacta.

          Compare em cada phrase_XX:
          1. amora_child_final_b_plus60.wav
          2. amora_voice_signature_v1_soft.wav

          amora-signature-v1-report.json registra os parâmetros e RTF no runner.
          Isto ainda é Voice Kitchen: promoção Android/produção continua sujeita
          ao teste físico e à aprovação auditiva de BK.
          EOF

      - name: Upload WAV audition pack
        uses: actions/upload-artifact@v4
        with:
          name: amora-voice-kitchen-signature-v1-soft
          path: voice-kitchen-wavs/
          if-no-files-found: error
          retention-days: 30
