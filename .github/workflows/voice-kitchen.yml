name: Voice Kitchen

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/voice_kitchen/**"
      - "tests/test_voice_kitchen_*.py"
      - ".github/workflows/voice-kitchen.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audition runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install "supertonic==1.3.1" "pyworld-prebuilt==0.3.6.post1"

      - name: Render F1/F5 candidates
        run: |
          python tools/voice_kitchen/render_supertonic_candidates.py \
            --out-dir voice-kitchen-wavs \
            --steps 8 \
            --speed 1.0

      - name: Apply WORLD polished child candidates
        run: |
          python tools/voice_kitchen/apply_world_vtl_candidates.py \
            --root voice-kitchen-wavs

      - name: Render final CLEAR/PLUS A-B
        run: |
          python tools/voice_kitchen/apply_world_final_ab.py \
            --root voice-kitchen-wavs

          cat > voice-kitchen-wavs/README.txt <<'EOF'
          AMORA VOICE KITCHEN — FINAL CLEAR / PLUS A-B

          Base:
          - amora_mix_p60_s40.wav = 60% speaker 0 + 40% speaker 4

          Feedback consolidado:
          - CLEAR_POLISHED: mais limpa, clara e fácil de entender;
          - PLUS_POLISHED: um pouco mais natural;
          - ambos já estão na região boa de idade/tamanho vocal.

          Esta rodada fecha o intervalo entre os dois e NÃO abre uma nova busca.

          Compare em phrase_01:
          1. world_child_clear_polished.wav
          2. amora_child_final_a_clear60.wav
          3. amora_child_final_b_plus60.wav
          4. world_child_plus_polished.wav

          FINAL_A_CLEAR60
          - 60% da direção CLEAR / 40% da direção PLUS
          - F0 alvo: 283.2 Hz
          - max F0: 1.184x
          - pitch range: 1.047x
          - warp: 700 Hz 1.124x / 1500 Hz 1.109x / 3000 Hz 1.067x
          - HF shelf: -2.24 dB
          - objetivo: preservar um pouco mais de clareza/inteligibilidade.

          FINAL_B_PLUS60
          - 40% da direção CLEAR / 60% da direção PLUS
          - F0 alvo: 284.8 Hz
          - max F0: 1.186x
          - pitch range: 1.048x
          - warp: 700 Hz 1.126x / 1500 Hz 1.111x / 3000 Hz 1.068x
          - HF shelf: -2.36 dB
          - objetivo: preservar um pouco mais da naturalidade do PLUS.

          Ainda NÃO há textura Vocaloid nesta rodada. O vencedor desta comparação
          deve congelar a base de idade/tamanho vocal antes da VoiceSignature synth.

          final-ab-report.json registra os parâmetros realmente usados.
          Isso continua sendo Voice Kitchen; não certifica APK/Galaxy A15.
          EOF

      - name: Upload WAV audition pack
        uses: actions/upload-artifact@v4
        with:
          name: amora-voice-kitchen-final-ab
          path: voice-kitchen-wavs/
          if-no-files-found: error
          retention-days: 30
