name: Voice Kitchen

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/voice_kitchen/**"
      - ".github/workflows/voice-kitchen.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Supertonic runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install supertonic

      - name: Render F1/F5 candidates
        run: |
          python tools/voice_kitchen/render_supertonic_candidates.py \
            --out-dir voice-kitchen-wavs \
            --steps 8 \
            --speed 1.0

      - name: Upload WAV audition pack
        uses: actions/upload-artifact@v4
        with:
          name: amora-voice-kitchen-f1-f5
          path: voice-kitchen-wavs/
          if-no-files-found: error
          retention-days: 30
