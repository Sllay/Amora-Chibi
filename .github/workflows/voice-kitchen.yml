name: Voice Kitchen

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/voice_kitchen/**"
      - "tests/test_voice_kitchen_*.py"
      - ".github/workflows/voice-kitchen.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audition runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install "supertonic==1.3.1" "pyworld-prebuilt==0.3.6.post1"

      - name: Render F1/F5 candidates
        run: |
          python tools/voice_kitchen/render_supertonic_candidates.py \
            --out-dir voice-kitchen-wavs \
            --steps 8 \
            --speed 1.0

      - name: Apply WORLD source-filter candidates
        run: |
          python tools/voice_kitchen/apply_world_vtl_candidates.py \
            --root voice-kitchen-wavs

          cat > voice-kitchen-wavs/README.txt <<'EOF'
          AMORA VOICE KITCHEN — WORLD source-filter audition

          Base preferida por BK:
          - amora_mix_p60_s40.wav = 60% speaker 0/F1 + 40% speaker 4/F5

          IMPORTANTE:
          - o experimento Signalsmith anterior removeu o chipmunk, mas BK relatou
            timbre alienígena; por isso não é o caminho desta rodada.
          - esta rodada usa WORLD para separar F0, envelope espectral e
            aperiodicidade e faz mudanças muito menores.

          Ouça nesta ordem:
          1. amora_mix_p60_s40.wav
          2. world_resynth_neutral.wav
          3. world_vtl_1p025.wav
          4. world_vtl_1p04_clean.wav
          5. world_vtl_1p055_clean.wav

          Candidatos:
          - WORLD_RESYNTH_NEUTRAL: sem mudança intencional; mede a assinatura do
            próprio vocoder WORLD.
          - WORLD_VTL_1P025: F0 0 st / trato 1.025x (~+0.43 st equivalente) /
            aperiodicidade intacta.
          - WORLD_VTL_1P04_CLEAN: F0 +0.20 st / trato 1.04x (~+0.68 st) /
            aperiodicidade 0.98x.
          - WORLD_VTL_1P055_CLEAN: F0 +0.35 st / trato 1.055x (~+0.93 st) /
            aperiodicidade 0.96x.

          Ainda NÃO existe textura Vocaloid nesta rodada. Primeiro a base precisa
          ficar limpa, jovem/feminina e sem esquilo/alien. Só depois entra a
          textura vocal-synth como camada separada.

          world-processing-report.json contém RTF medido no runner x86_64.
          Isso não certifica Galaxy A15.
          EOF

      - name: Upload WAV audition pack
        uses: actions/upload-artifact@v4
        with:
          name: amora-voice-kitchen-world-vtl
          path: voice-kitchen-wavs/
          if-no-files-found: error
          retention-days: 30
