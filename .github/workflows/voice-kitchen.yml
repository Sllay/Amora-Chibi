name: Voice Kitchen

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/voice_kitchen/**"
      - "tests/test_voice_kitchen_*.py"
      - ".github/workflows/voice-kitchen.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audition runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install "supertonic==1.3.1" "pyworld-prebuilt==0.3.6.post1"

      - name: Render F1/F5 candidates
        run: |
          python tools/voice_kitchen/render_supertonic_candidates.py \
            --out-dir voice-kitchen-wavs \
            --steps 8 \
            --speed 1.0

      - name: Apply WORLD polished child candidates
        run: |
          python tools/voice_kitchen/apply_world_vtl_candidates.py \
            --root voice-kitchen-wavs

          cat > voice-kitchen-wavs/README.txt <<'EOF'
          AMORA VOICE KITCHEN — child polish audition

          Base:
          - amora_mix_p60_s40.wav = 60% speaker 0/F1 + 40% speaker 4/F5

          Feedback que originou esta rodada:
          - WORLD_CHILD_BALANCED e WORLD_CHILD_CLEAR finalmente mudaram a percepção
            de idade/tamanho vocal e ficaram bons;
          - BK pediu só um pouco mais de sensação infantil;
          - ainda havia estridência/brilho excessivo.

          Então esta rodada NÃO volta para pitch alto. Ela mantém F0 bounded,
          aumenta muito pouco os sinais de trato vocal menor e adiciona um shelf
          suave nos agudos diretamente no envelope WORLD.

          Compare primeiro em phrase_01 nesta ordem:
          1. world_child_balanced.wav
          2. world_child_balanced_polished.wav
          3. world_child_clear.wav
          4. world_child_clear_polished.wav
          5. world_child_plus_polished.wav

          Novos candidatos:
          - WORLD_CHILD_BALANCED_POLISHED
            alvo F0 268 Hz; max F0 1.15x; warp low/mid max 1.10x;
            shelf HF -1.5 dB.
          - WORLD_CHILD_CLEAR_POLISHED
            alvo F0 280 Hz; max F0 1.18x; warp low/mid max 1.12x;
            shelf HF -2.0 dB.
          - WORLD_CHILD_PLUS_POLISHED
            alvo F0 288 Hz; max F0 1.19x; warp low/mid max 1.13x;
            shelf HF -2.6 dB.

          O topo espectral volta para ~1.0x em 8 kHz nos novos candidatos para
          não transformar o ganho de idade em nasalidade/estridência.

          Ainda NÃO há textura Vocaloid nesta rodada. Primeiro fechamos a base
          vocal jovem/limpa; a assinatura vocal-synth continua como camada separada.

          world-processing-report.json registra a mediana F0 medida, o ratio real,
          shelf e RTF no runner x86_64. Isso não certifica Galaxy A15.
          EOF

      - name: Upload WAV audition pack
        uses: actions/upload-artifact@v4
        with:
          name: amora-voice-kitchen-world-child-polish
          path: voice-kitchen-wavs/
          if-no-files-found: error
          retention-days: 30
