name: Amora art - OVH anonymous live probe

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  live-ovh:
    # One-off opt-in: runs only when the enhancement label is added to PR #286.
    # No secrets, Core service, database, migrations or production deploys.
    if: >-
      github.event.label.name == 'enhancement' &&
      github.event.pull_request.number == 286 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/amora-art-sdxl-style-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Amora art adapter (no app boot)
        run: python -m pip install -e .
      - name: Generate one anonymous synthetic cartoon image
        env:
          OVH_AI_ENDPOINTS_ACCESS_TOKEN: ''
        run: python tools/art/ovh_live_probe.py --output reports/art-probe
      - name: Save generated image and typed diagnostic
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: amora-ovh-live-probe-${{ github.run_id }}
          path: reports/art-probe/
          if-no-files-found: warn
          retention-days: 7
