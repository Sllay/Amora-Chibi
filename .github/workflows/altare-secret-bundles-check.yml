name: Altare - check encrypted Core and Discord env bundles

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'Sllay' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.number == 349 &&
        github.event.comment.body == '/amora altare env check'))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate private bundles without printing secret values
        env:
          AMORA_CORE_BUNDLE: ${{ secrets.AMORA_CORE_ENV_BUNDLE }}
          AMORA_DISCORD_BUNDLE: ${{ secrets.AMORA_DISCORD_ENV_BUNDLE }}
          ALTARE_TOKEN_CONFIG: ${{ secrets.ALTARE_TOKEN_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python - <<'PY'
          import os
          from tools.ops.altare_env_handoff import parse_source, prepare

          if not os.getenv('ALTARE_TOKEN_CONFIG', '').strip():
              print('ALTARE_TOKEN_CONFIG_MISSING')
              raise SystemExit(2)
          prepared = {}
          for service, key in [('core', 'AMORA_CORE_BUNDLE'), ('discord', 'AMORA_DISCORD_BUNDLE')]:
              raw = os.getenv(key, '')
              if not raw.strip():
                  print('ALTARE_' + service.upper() + '_BUNDLE_MISSING')
                  raise SystemExit(2)
              try:
                  variables, missing = prepare(parse_source(raw), kind=service)
              except Exception:
                  print('ALTARE_' + service.upper() + '_BUNDLE_INVALID')
                  raise SystemExit(2)
              if missing:
                  print('ALTARE_' + service.upper() + '_MISSING_NAMES=' + ','.join(missing))
                  raise SystemExit(2)
              prepared[service] = variables
              print('ALTARE_' + service.upper() + '_BUNDLE_VALID_NAMES=' + str(len(variables)))
          core = prepared['core']
          discord = prepared['discord']
          if len(core.get('AMORA_MESSAGING_SERVICE_TOKEN', '').encode()) < 32 or (
              core.get('AMORA_MESSAGING_SERVICE_TOKEN') != discord.get('AMORA_MESSAGING_SERVICE_TOKEN')
          ):
              print('ALTARE_SHARED_WORKER_TOKEN_MISMATCH_OR_TOO_SHORT')
              raise SystemExit(2)
          if len(core.get('AMORA_SECRET_LOCAL_API_TOKEN', '').encode()) < 32:
              print('ALTARE_CORE_ADMIN_TOKEN_TOO_SHORT')
              raise SystemExit(2)
          print('ALTARE_PRIVATE_BUNDLES_PREFLIGHT_PASS')
          PY
