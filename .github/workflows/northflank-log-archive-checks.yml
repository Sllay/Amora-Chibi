name: Northflank encrypted archive contracts

on:
  pull_request:
    paths:
      - 'tools/ops/northflank_log_collector.py'
      - 'tools/ops/northflank_log_archive.py'
      - 'tests/test_northflank_log_archive.py'
      - '.github/workflows/northflank-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Secret-free collector and encrypted ZIP tests
        run: |
          python -m unittest discover -s tests -p test_northflank_log_archive.py -v
