name: Messaging workers

on:
  push:
    paths:
      - 'workers/common/**'
      - 'workers/discord/**'
      - 'workers/whatsapp/**'
      - 'tests/messaging_workers.test.mjs'
      - 'tests/discord_worker_runtime.test.mjs'
      - '.github/workflows/messaging-workers.yml'
  pull_request:
    paths:
      - 'workers/common/**'
      - 'workers/discord/**'
      - 'workers/whatsapp/**'
      - 'tests/messaging_workers.test.mjs'
      - 'tests/discord_worker_runtime.test.mjs'
      - '.github/workflows/messaging-workers.yml'

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24 runtime
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, Node 24 runtime
        with:
          node-version: '22.23.4'
      - name: Verify minimum secure Node
        run: node -e "const [a,b,c]=process.versions.node.split('.').map(Number); if(a<22||(a===22&&(b<23||(b===23&&c<4)))) process.exit(1)"
      - name: Parse worker modules
        run: |
          node --check workers/common/core-client.mjs
          node --check workers/discord/commands.mjs
          node --check workers/discord/http.mjs
          node --check workers/discord/normalize.mjs
          node --check workers/discord/social-runtime.mjs
          node --check workers/discord/worker.mjs
          node --check workers/whatsapp/normalize.mjs
          node --check workers/whatsapp/worker.mjs
      - name: Adapter contract tests
        run: node --test tests/messaging_workers.test.mjs tests/discord_worker_runtime.test.mjs
      - name: Resolve exact Baileys release, import worker and audit installed tree
        working-directory: workers/whatsapp
        run: |
          npm install --ignore-scripts --no-fund --no-audit
          node -e "const p=require('./node_modules/@whiskeysockets/baileys/package.json'); if(p.version!=='7.0.0-rc14') throw new Error('unexpected Baileys version '+p.version)"
          node -e "import('./worker.mjs').then(()=>process.stdout.write('baileys-worker-import-ok\n'))"
          npm audit --omit=dev --audit-level=high
