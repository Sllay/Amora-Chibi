name: Web browser worker

on:
  pull_request:
    paths:
      - 'workers/browser/**'
      - 'core/amora/web_tools/**'
      - 'tests/test_web_browser_run2.py'
      - 'tests/test_web_remote_reader_low_memory.py'
      - 'tests/test_web_search_relevance.py'
      - 'tests/test_web_groq_query_planner.py'
      - 'tests/test_web_discord_link_delivery.py'
      - 'docs/engineering/AMORA_WEB_RUN2.md'
      - 'docs/engineering/AMORA_WEB_LOW_MEMORY.md'
      - '.github/workflows/web-browser-worker.yml'
  push:
    paths:
      - 'workers/browser/**'
      - 'core/amora/web_tools/**'
      - 'tests/test_web_browser_run2.py'
      - 'tests/test_web_remote_reader_low_memory.py'
      - 'tests/test_web_search_relevance.py'
      - 'tests/test_web_groq_query_planner.py'
      - 'tests/test_web_discord_link_delivery.py'
      - 'docs/engineering/AMORA_WEB_RUN2.md'
      - 'docs/engineering/AMORA_WEB_LOW_MEMORY.md'
      - '.github/workflows/web-browser-worker.yml'

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Core contracts
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Compile browser worker and Core bridge
        run: python -m compileall -q workers/browser core/amora/web_tools
      - name: Test isolated authenticated worker and Core fallback without public network
        run: python -m pytest tests/test_web_browser_run2.py tests/test_web_remote_reader_low_memory.py tests/test_web_tools_run1.py tests/test_web_search_relevance.py tests/test_web_groq_query_planner.py tests/test_web_discord_link_delivery.py -q

  browser-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build actual Playwright/Chromium worker image
        run: docker build -f workers/browser/Dockerfile -t amora-browser:test .
      - name: Verify nonroot image and Playwright/browser version match
        run: |
          docker run --rm --entrypoint sh amora-browser:test -c 'test "$(id -u)" != "0" && python -c "from playwright._impl._driver import compute_driver_executable; import playwright; print(compute_driver_executable())"'
      - name: Execute real JavaScript with Chromium sandbox in worker image
        run: |
          # CI's default seccomp denies namespace syscalls. The test opens them
          # while still launching a nonroot, sandbox-enabled Chromium process.
          # Production must apply an audited user-namespace seccomp profile and
          # a network egress deny-private policy, not this CI configuration.
          docker run --rm --init --ipc=host --security-opt seccomp=unconfined --entrypoint python amora-browser:test -m workers.browser.smoke
