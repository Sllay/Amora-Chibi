name: Voice Emotion Kitchen

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "core/amora/voice/expression.py"
      - "tools/voice_kitchen/render_emotion_signature_candidates.py"
      - "tests/test_voice_expression_v1.py"
      - ".github/workflows/voice-emotion-kitchen.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24 runtime

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24 runtime
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "supertonic==1.3.1" "pyworld-prebuilt==0.3.6.post1"

      - name: Test expression planner
        run: |
          pytest tests/test_voice_expression_v1.py

      - name: Render emotion expression pack
        run: |
          python tools/voice_kitchen/render_emotion_signature_candidates.py \
            --out-dir voice-emotion-wavs \
            --steps 8

          cat > voice-emotion-wavs/README.txt <<'EOF'
          AMORA VOICE KITCHEN — EMOTION / PROSODY V2

          MOTIVO DA V2
          A primeira rodada ficou boa conceitualmente, mas leve demais na escuta.
          BK pediu mais percepção emocional sem teatralizar nem trocar a voz.

          IDENTIDADE CONTINUA CONGELADA
          - Base: AMORA_CHILD_FINAL_B_PLUS60
          - Assinatura: AMORA_VOICE_SIGNATURE_V1_SOFT
          - speaker/style 60/40 não muda por emoção
          - nenhum novo formant/VTL
          - textura fixa da VoiceSignature não muda

          EXPRESSÃO V2
          - rate_scale: tristeza e carinho mais lentos; raiva/felicidade mais vivas
          - energy_scale: tristeza mais baixa; raiva mais firme
          - pitch_range_scale: contorno emocional mais perceptível
          - f0_register_scale: micro-registro bounded 0.97..1.02; tristeza pode
            descer levemente sem virar efeito de pitch/identidade
          - softness/firmness: nesta audição controlam apenas um shelf tonal muito
            pequeno, RMS-matched, para carinho soar mais macio e raiva mais seca
          - pause_scale continua no contrato para o adapter/runtime; não inventamos
            API de pausa no helper Python do Supertonic

          PRESETS
          - emotion_neutra_v2.wav
          - emotion_feliz_v2.wav
          - emotion_carinhosa_v2.wav
          - emotion_brava_v2.wav
          - emotion_triste_v2.wav

          O QUE OUVIR
          - TRISTE: mais lenta, mais baixa, registro um pouco menor e contorno mais
            fechado; melancólica sem virar voz diferente.
          - CARINHOSA: um pouco mais lenta/baixa e bem mais macia; sensação de
            afeto/proximidade sem parecer triste.
          - BRAVA: mais firme, energética e seca, mas sem gritar.
          - FELIZ: um pouco mais viva e aberta.
          - NEUTRA: deve continuar sendo a referência aprovada.

          Comece por phrase_04 e depois confirme phrase_01/02.

          REGRA DE FALHA
          VoiceProsodyPlanner continua opcional. safe_plan() retorna NEUTRO se
          falhar; base + VoiceSignature continuam funcionando normalmente.

          emotion-expression-v2-report.json registra os planos usados.
          EOF

      - name: Upload emotion audition pack
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24 runtime
        with:
          name: amora-voice-emotion-prosody-v2
          path: voice-emotion-wavs/
          if-no-files-found: error
          retention-days: 30
