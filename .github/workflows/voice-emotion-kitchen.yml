name: Voice Emotion Kitchen

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "core/amora/voice/expression.py"
      - "tools/voice_kitchen/render_emotion_signature_candidates.py"
      - "tests/test_voice_expression_v1.py"
      - ".github/workflows/voice-emotion-kitchen.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "supertonic==1.3.1" "pyworld-prebuilt==0.3.6.post1"

      - name: Test expression planner
        run: |
          pytest tests/test_voice_expression_v1.py

      - name: Render emotion expression pack
        run: |
          python tools/voice_kitchen/render_emotion_signature_candidates.py \
            --out-dir voice-emotion-wavs \
            --steps 8

          cat > voice-emotion-wavs/README.txt <<'EOF'
          AMORA VOICE KITCHEN — EMOTION / PROSODY V1

          IDENTIDADE CONGELADA
          - Base: AMORA_CHILD_FINAL_B_PLUS60
          - Assinatura: AMORA_VOICE_SIGNATURE_V1_SOFT
          - sem pitch shift absoluto novo
          - sem novo formant/VTL
          - sem mudar a textura fixa da VoiceSignature por emoção

          MODULAÇÃO TESTADA
          - rate_scale: pequena mudança de cadência
          - pitch_range_scale: só amplitude do contorno F0 ao redor da mesma mediana
          - energy_scale: energia/volume bounded

          CONTRATO RESERVADO PARA O RUNTIME
          - pause_scale
          - softness
          - firmness
          Esses campos já fazem parte do plano modular, mas o helper Python do
          Supertonic não expõe um silenceScale equivalente de forma verificada,
          então esta audição não inventa API.

          PRESETS PARA ESCUTA
          - emotion_neutra.wav
          - emotion_feliz.wav
          - emotion_carinhosa.wav
          - emotion_brava.wav
          - emotion_triste.wav

          Comece por phrase_04: ela tem conteúdo relacional e deixa diferença de
          expressão mais fácil de perceber. Depois confirme phrase_01 e phrase_02.

          REGRA DE FALHA
          VoiceProsodyPlanner é opcional. safe_plan() retorna NEUTRO se o módulo
          falhar; a VoiceSignature/base continuam funcionando normalmente.

          emotion-expression-report.json contém os estados V/A/D e os parâmetros
          efetivamente planejados para cada preset.
          EOF

      - name: Upload emotion audition pack
        uses: actions/upload-artifact@v4
        with:
          name: amora-voice-emotion-prosody-v1
          path: voice-emotion-wavs/
          if-no-files-found: error
          retention-days: 30
