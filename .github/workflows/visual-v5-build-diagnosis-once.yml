name: One-shot V5 Northflank build diagnosis
on:
  push:
    branches: [ops/visual-v5-build-diagnosis-20261127]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read build statuses and emit only allowlisted signals
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NF_BACKUP_API_TOKEN }}
          NORTHFLANK_TEAM_ID: ${{ vars.NORTHFLANK_TEAM_ID || 'mejorberrys-team' }}
          NORTHFLANK_PROJECT_ID: ${{ vars.NORTHFLANK_PROJECT_ID || 'default' }}
        run: python tools/ops/visual-v5-build-diagnosis.py
